<style>
  :root{--forest:#063f35;--deep:#032b25;--green:#087f5b;--green2:#10a371;--lime:#e9f5d9;--gold:#f8cb63;--gold2:#fff2cc;--ink:#15332f;--muted:#60756d;--border:#e2ebe3;--canvas:#f9faf6;--white:#fff;--shadow:0 28px 80px rgba(5,46,36,.10);--smallShadow:0 12px 34px rgba(5,46,36,.08);--radius:24px;--max:1200px;}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:95px}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:"Noto Sans Bengali","Hind Siliguri","Nirmala UI","Vrinda",system-ui,sans-serif;font-size:17px;line-height:1.85;overflow-x:hidden}

  .hero-bottom{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.hero-seal{display:flex;align-items:center;gap:12px;color:#416252;font-size:13px;font-weight:800}.hero-seal .tick{width:30px;height:30px;border-radius:50%;background:#dff0e4;display:grid;place-items:center;color:var(--green)}

  .hero-card-caption{display:flex;justify-content:space-between;align-items:center;padding:16px 8px 6px;gap:12px}.hero-card-caption h3{margin:0;color:var(--deep);font-size:19px;line-height:1.45}.hero-card-caption span{color:var(--muted);font-size:12px;font-weight:700}

  /* glance */
  .quick-wrap{position:relative;z-index:3;margin-top:-30px}.quick{display:grid;grid-template-columns:repeat(3,1fr);background:var(--deep);border-radius:20px;box-shadow:var(--shadow);padding:29px 20px;color:#fff;gap:16px}.quick-item{text-align:center;padding:0 16px;border-right:1px solid rgba(255,255,255,.16)}.quick-item:last-child{border:none}.quick-item strong{display:block;color:var(--gold);font-size:29px;font-weight:950;line-height:1.4}.quick-item span{font-size:13px;color:#d4e5d9;font-weight:750}

  .coast-feature{padding:90px 0 0}.coast-scene{position:relative;min-height:350px;border-radius:30px;overflow:hidden;box-shadow:var(--shadow);background:#4b7f71}.coast-scene img{position:absolute;width:100%;height:100%;object-fit:cover;inset:0}.coast-scene:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,38,33,.82),rgba(0,38,33,.48) 53%,rgba(0,38,33,.08))}.coast-inner{position:relative;z-index:1;color:white;padding:70px 64px;max-width:690px}.coast-inner small{font-size:14px;color:#ffe4a0;font-weight:850}.coast-inner h2{font-size:clamp(30px,4vw,48px);line-height:1.4;letter-spacing:-.5px;margin:12px 0}.coast-inner p{font-size:16px;line-height:1.9;color:#e9f6f0;margin:0}

  .gallery-grid{display:grid;grid-template-columns:1fr .78fr 1fr;gap:18px;align-items:stretch}.gallery-item{border:0;padding:0;position:relative;overflow:hidden;border-radius:23px;box-shadow:var(--smallShadow);min-height:330px;isolation:isolate;background:#fff}.gallery-item img{height:100%;width:100%;position:absolute;inset:0;object-fit:cover;transition:transform .5s}.gallery-item:hover img{transform:scale(1.04)}.gallery-item:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(0deg,rgba(0,25,18,.78),transparent)}.gallery-item span{position:absolute;z-index:1;bottom:22px;left:23px;right:23px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-weight:850;font-size:16px}.gallery-item .icon{width:22px;height:22px}.gallery-item:nth-child(3) img{object-fit:contain;background:#ebf6df}
